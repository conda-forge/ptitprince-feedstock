{% set name = "ptitprince" %}
{% set version = "0.3.1" %}
{% set python_min = "3.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ptitprince-{{ version }}.tar.gz
  sha256: 2840a3a1d8daba6567c15ce192d683da75a5d2b648451a1a26b271485b70254d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python {{ python_min }}
    - pip
    - hatchling    
  run:
    - python >={{ python_min }}
    - matplotlib-base >=3.9
    - numpy >=1.16
    - scipy >=1.0
    - seaborn >=0.13.2

test:
  imports:
    - ptitprince
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/pog87/PtitPrince
  summary: A Python implementation of Rainclouds, originally on R, ggplot2. Written on top of seaborn.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pog87
    - sappelhoff
